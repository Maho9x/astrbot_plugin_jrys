name: astrbot_plugin_jrysplus
desc: 
  今日运势卡片，支持按运势分数匹配运势图片，图片可自行在/backgroundFolder中替换
  基于koishi-plugin-jrys-prpr修改
help: 
  【基础指令】
  - /jrys ：查询今日运势（「今日运势」「运势」等关键词也可触发）
  - /原图 ：获取今日运势对应的背景图
  - 指令后加 -s ：以「背景图 + 文字」的图文形式输出
version: v2.2.0
author: Maho9x
repo: https://github.com/Maho9x/astrbot_plugin_jrys

support_platforms:
  - aiocqhttp
